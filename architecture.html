<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Hrdle Architecture</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0f1117;
    --surface: #181b24;
    --surface-2: #1f2330;
    --border: #2a3040;
    --text: #e6e9f0;
    --muted: #8b93a6;
    --accent: #6ea7ff;
    --accent-dim: rgba(110, 167, 255, 0.15);
    --green: #6ed18a;
    --orange: #ffb86b;
    --red: #ff7a7a;
    --purple: #c08bff;
    --pink: #ff8bcb;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif; font-size: 14px; }
  a { color: var(--accent); text-decoration: none; }
  code { font-family: 'JetBrains Mono', Menlo, Monaco, Consolas, monospace; font-size: 0.85em; background: var(--surface-2); padding: 1px 5px; border-radius: 3px; color: var(--text); }
  header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px; background: var(--surface); position: sticky; top: 0; z-index: 10; }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .version { color: var(--accent); font-family: monospace; font-size: 13px; }
  header .meta { color: var(--muted); font-size: 12px; margin-left: auto; }
  header .search { flex: 0 0 280px; max-width: 100%; }
  header .search input { width: 100%; padding: 8px 12px; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }
  header .search input:focus { outline: none; border-color: var(--accent); }
  nav.tabs { display: flex; gap: 2px; padding: 0 24px; background: var(--surface); border-bottom: 1px solid var(--border); overflow-x: auto; position: sticky; top: 75px; z-index: 9; }
  nav.tabs button { background: transparent; color: var(--muted); border: none; padding: 12px 16px; cursor: pointer; font-size: 13px; font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; }
  nav.tabs button:hover { color: var(--text); }
  nav.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  nav.tabs .count { display: inline-block; margin-left: 6px; padding: 1px 7px; background: var(--surface-2); color: var(--muted); border-radius: 10px; font-size: 11px; font-weight: 600; }
  nav.tabs button.active .count { background: var(--accent-dim); color: var(--accent); }
  main { padding: 24px; max-width: 1400px; margin: 0 auto; }
  .panel { display: none; }
  .panel.active { display: block; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 8px; }
  .card-header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 6px; }
  .card-header .name { font-weight: 600; color: var(--text); font-size: 14px; }
  .card-header .file { font-family: monospace; font-size: 12px; color: var(--muted); }
  .card-header .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; font-family: monospace; }
  .badge.GET { background: rgba(110, 209, 138, 0.15); color: var(--green); }
  .badge.POST { background: rgba(255, 184, 107, 0.15); color: var(--orange); }
  .badge.PUT { background: rgba(192, 139, 255, 0.15); color: var(--purple); }
  .badge.DELETE { background: rgba(255, 122, 122, 0.15); color: var(--red); }
  .badge.WS { background: rgba(110, 167, 255, 0.15); color: var(--accent); }
  .badge.PATCH { background: rgba(192, 139, 255, 0.15); color: var(--purple); }
  .badge.ALL { background: rgba(255, 184, 108, 0.15); color: var(--orange, #ffb86c); }
  .card .summary { color: var(--muted); line-height: 1.55; font-size: 13px; }
  .card .deps, .card .hooks-list, .card .parents { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .card .deps span, .card .hooks-list span, .card .parents span { display: inline-block; background: var(--surface-2); color: var(--text); padding: 2px 8px; border-radius: 3px; margin-right: 4px; margin-top: 3px; font-family: monospace; font-size: 11px; cursor: pointer; }
  .card .deps span:hover, .card .hooks-list span:hover, .card .parents span:hover { background: var(--accent-dim); color: var(--accent); }
  .card .label { color: var(--muted); margin-right: 6px; }
  .group-header { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin: 20px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .group-header:first-child { margin-top: 0; }
  .overview-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .overview-grid .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .overview-grid .stat .num { font-size: 28px; font-weight: 700; color: var(--accent); }
  .overview-grid .stat .label { color: var(--muted); font-size: 12px; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .overview .desc { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; line-height: 1.6; color: var(--text); }
  .overview .desc h2 { margin: 0 0 8px; font-size: 16px; }
  .overview .desc .stack { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin-top: 12px; font-size: 13px; }
  .overview .desc .stack dt { color: var(--muted); font-weight: 600; }
  .overview .arch-diagram { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin: 0 0 20px; overflow-x: auto; font-size: 12.5px; line-height: 1.45; color: var(--text); font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
  .overview .ws-list { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 20px; margin-bottom: 20px; }
  .overview .ws-list .ws-item { display: grid; grid-template-columns: 110px 1fr; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .overview .ws-list .ws-item:last-child { border-bottom: none; }
  .overview .ws-list .ws-name { font-family: monospace; color: var(--accent); font-weight: 600; }
  .overview .ws-list .ws-desc { color: var(--muted); line-height: 1.5; }
  .ws-section { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 16px; }
  .ws-section h3 { margin: 0 0 8px; font-size: 14px; }
  .ws-section .endpoint { font-family: monospace; color: var(--accent); font-size: 14px; margin-bottom: 8px; }
  .ws-section .desc { color: var(--muted); line-height: 1.55; margin-bottom: 16px; font-size: 13px; }
  .ws-section .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 720px) { .ws-section .grid { grid-template-columns: 1fr; } }
  .ws-section .col h4 { margin: 0 0 8px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .ws-section .col .sub { margin-top: 12px; }
  .ws-section .col .sub .lbl { font-size: 11px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
  .ws-section .tag { display: inline-block; background: var(--surface-2); color: var(--text); padding: 3px 8px; border-radius: 3px; margin: 2px 3px 2px 0; font-family: monospace; font-size: 11px; }
  .ws-section .intervals { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; font-size: 12px; }
  .ws-section .intervals dt { color: var(--muted); }
  .ws-section .intervals dd { margin: 0; font-family: monospace; color: var(--text); }
  .ws-section .binary { font-family: monospace; background: var(--surface-2); padding: 8px 12px; border-radius: 4px; color: var(--text); font-size: 12px; margin-top: 12px; display: inline-block; }
  .flow { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px 20px; margin-bottom: 12px; }
  .flow h3 { margin: 0 0 12px; font-size: 14px; color: var(--accent); }
  .flow ol { margin: 0; padding-left: 0; list-style: none; counter-reset: step; }
  .flow li { position: relative; padding: 6px 0 6px 32px; counter-increment: step; line-height: 1.45; font-size: 13px; }
  .flow li::before { content: counter(step); position: absolute; left: 0; top: 5px; width: 22px; height: 22px; background: var(--accent-dim); color: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
  .flow li:not(:last-child)::after { content: ''; position: absolute; left: 10px; top: 28px; bottom: -6px; width: 2px; background: var(--border); }
  .empty { color: var(--muted); text-align: center; padding: 40px; font-size: 13px; }
  .type-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; margin-bottom: 6px; }
  .type-card .tname { color: var(--accent); font-family: monospace; font-weight: 600; margin-bottom: 4px; }
  .type-card .tfields { font-family: monospace; font-size: 12px; color: var(--muted); line-height: 1.5; word-break: break-word; }
  .loading { text-align: center; padding: 60px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Hrdle Architecture</h1>
  <span class="version" id="hdr-version">v?.?.?</span>
  <div class="search"><input type="search" id="q" placeholder="検索 (name, file, description...)"></div>
  <div class="meta" id="hdr-meta"></div>
</header>
<nav class="tabs" id="tabs">
  <button data-tab="overview" class="active">Overview</button>
  <button data-tab="backend-services">Backend Services<span class="count" id="cnt-services"></span></button>
  <button data-tab="backend-routes">API Routes<span class="count" id="cnt-routes"></span></button>
  <button data-tab="frontend-components">Components<span class="count" id="cnt-components"></span></button>
  <button data-tab="frontend-hooks">Hooks<span class="count" id="cnt-hooks"></span></button>
  <button data-tab="websocket">WebSocket</button>
  <button data-tab="types">Types<span class="count" id="cnt-types"></span></button>
  <button data-tab="flows">Data Flows<span class="count" id="cnt-flows"></span></button>
</nav>
<main>
  <div id="loading" class="loading">Loading architecture.json...</div>
  <script type="application/json" id="arch-data">{
  "name": "Hrdle",
  "version": "0.3.143",
  "generated": "2026-08-16",
  "summary": "Web-based terminal session manager for coding agents (Claude Code, Codex, Grok, Kimi, OpenCode). Runs them in herdr workspaces and provides a web UI for remote access from tablets and phones, plus a companion app for the EVEN G2 glasses",
  "stack": {
    "backend": "Bun runtime + Hono",
    "frontend": "React 19 + Vite + Tailwind v4 + xterm.js",
    "shared": "Zod v4 schemas in shared/types.ts",
    "transport": "Multiplexed WebSocket /ws/mux + the herdr socket API (NDJSON RPC) + per-pane control streams. The terminal is drawn server-side: PaneViewport frames composed from pane.read (herdr holds the history, up to 1000 lines)",
    "glasses": "EvenHub SDK app (glasses/, built to out.ehpk) plus a browser simulator served at /glasses"
  },
  "workspaces": [
    {
      "name": "backend",
      "desc": "Hono API server (Bun). Drives herdr, serves history and peers, and provides the CLI"
    },
    {
      "name": "frontend",
      "desc": "React SPA. Three layouts: tablet, mobile and desktop"
    },
    {
      "name": "shared",
      "desc": "Types and Zod schemas (types.ts) plus identity.json readers, imported by every other workspace"
    },
    {
      "name": "glasses",
      "desc": "The EVEN G2 glasses app (EvenHub SDK -> out.ehpk). Its types are duplicated by hand, so a WS protocol change has to be followed here"
    }
  ],
  "diagram": [
    " Clients",
    "   |- Browser (React SPA) ------ tablet / mobile / desktop",
    "   |- G2 Glasses (EvenHub) ----- REST + /ws/mux (relay, screen mirror, STT)",
    "   |- Web Push ---------------- OS notification with no tab awake",
    "   '- hrdle send / peek -------- CLI (REST)",
    "            |",
    "            |  HTTPS / WSS (Tailscale certs)",
    "            v",
    "   +------------------+  NDJSON/ctrl  +-------+  PTY   +----------------------------+",
    "   | Hono API server  | <-----------> | herdr | <----> | Claude / Codex / Grok /    |",
    "   |   (Bun, :5924)   |  control mode +-------+        | Kimi / OpenCode  (panes)   |",
    "   +--------+---------+                                +----------------------------+",
    "            |",
    "            |  /api/peers (JWT proxy login, SSRF guard)",
    "            v",
    "   +------------------+",
    "   | Peer Hrdle x N   |  Tailscale tailnet (auto-discovery, /whoami on port+1)",
    "   +------------------+"
  ],
  "backend": {
    "services": [
      {
        "name": "HerdrClient",
        "file": "backend/src/services/herdr-client.ts",
        "summary": "Low-level client for the herdr socket API. NDJSON RPC (one connection per request; only events.subscribe is held open), a UTF-8-safe line reader built on a streaming TextDecoder, pane id conversion (%N <-> wK:pN), and PaneController (a resident control stream: raw input as base64, terminal.resize, terminal.frame)",
        "deps": []
      },
      {
        "name": "HerdrControlSession",
        "file": "backend/src/services/herdr-control.ts",
        "summary": "One instance per session (= one herdr workspace). Owns the split tree, tracks focus, spawns lazy controllers (WS subscribe or first input only; read-only REST stays pure RPC), tracks the cursor and alt-screen state by scanning frames, and gives a client a 30s grace period. Renders a single tab: a herdr workspace is workspace > tab > pane, so it filters to the active tab, follows tab.* events and never merges tabs into one flat chain; selectTab / createTab / closeTab drive the tab set. captureViewportHerdr composes the viewport (the visible slice, then recent, capped at herdr's 1000-line read limit). A pane with no runtime yet returns no scroll, which is a normal transient state right after a restore rather than a reason to refuse: it falls back to the client's rows and continues the subscribe, because refusing deadlocks against herdr's resume (which waits for a client size) and the session never opens",
        "deps": [
          "HerdrClient",
          "HerdrLayout",
          "PaneSizing"
        ]
      },
      {
        "name": "HerdrAgentStatusWatcher",
        "file": "backend/src/services/herdr-agent-status.ts",
        "summary": "Subscribes to herdr's pane.agent_status_changed (a per-pane subscription that requires pane_id) and to pane lifecycle events, pushing the session list the moment an agent's state changes. The values come from pane.list, so a dropped event costs latency rather than correctness (#390)",
        "deps": [
          "HerdrClient"
        ]
      },
      {
        "name": "HerdrLayout",
        "file": "backend/src/services/herdr-layout.ts",
        "summary": "The split tree this app owns (herdr's grid cannot be resized headlessly). Split, close, zoom, ratio adjustment and absolute sizing, rendered to tmux-convention TmuxLayoutNode rectangles",
        "deps": []
      },
      {
        "name": "HerdrService",
        "file": "backend/src/services/herdr.ts",
        "summary": "Maps session-level operations onto herdr workspaces: listing (agent detection from pane.process_info, native session ids from agent.list, agent_status idle/working/blocked/done), create and kill, previews, and moveSession. A session's id is herdr's workspace_id (w5Q), not its label - a label is text a person edits and the naming convention rewrites twice per task, so addressing by it moves a session's address mid-conversation. A label is still accepted, but an ambiguous one resolves to nothing rather than to whichever workspace sorts first. herdr's workspace order is the display order, so a reorder is a workspace.move and nothing is stored on this side",
        "deps": [
          "HerdrClient"
        ]
      },
      {
        "name": "SessionIdMigration",
        "file": "backend/src/services/session-id-migration.ts",
        "summary": "Moves settings written against a workspace *name* onto its workspace id, once at startup. Deliberately conservative: a key moves only when exactly one live workspace carries that name and the destination has no settings of its own, because a wrong guess paints a session in a colour chosen for a different one",
        "deps": [
          "HerdrClient",
          "SessionMetadataService"
        ]
      },
      {
        "name": "HerdrUpdateService",
        "file": "backend/src/services/herdr-update.ts",
        "summary": "Detects version skew between the herdr binary and the running server (herdr update swaps the binary and leaves the server on the old build). Reads herdr status --json with a 30s cache and warns on the dashboard. Applying it (update plus a supervised restart) happens only through POST /api/herdr/apply-update as a user action, never from the auto-update path. Output it cannot interpret degrades to no warning (#393)",
        "deps": [
          "HerdrClient"
        ]
      },
      {
        "name": "PaneState",
        "file": "backend/src/services/pane-state.ts",
        "summary": "The stripAnsi / detectPaneState heuristics (pane state for `send --wait` and `peek`)",
        "deps": []
      },
      {
        "name": "PaneSizing",
        "file": "backend/src/services/pane-sizing.ts",
        "summary": "Reconciles many clients' reported render sizes into one PTY size per pane. A pane has exactly one PTY, so the smallest requested extent wins per dimension (tmux's policy; the larger client sees unused margin) and a pane no client reports keeps its last size. Pure policy - it holds no state and talks to nothing",
        "deps": []
      },
      {
        "name": "PaneReaders",
        "file": "backend/src/services/pane-readers/",
        "summary": "What a pane is asking, read the way that pane's agent draws it. Dispatched on PaneInfo.agent, and an agent with no reader gets no options rather than a general rule - a guess offered to someone wearing the glasses is answered, while an omission is only read. One shape-matching reader for all of them offered a grep hit and a line of prose as answers. The blast radius is per agent: a TUI that changes breaks its own reader and no one else's",
        "deps": []
      },
      {
        "name": "AgentQuestion",
        "file": "backend/src/services/agent-question.ts",
        "summary": "The question an agent is waiting on, read from the agent's own record rather than from the screen it drew: Claude's transcript carries the AskUserQuestion call with its options and descriptions, kimi writes its own down. Scraping pixels for \"the row painted differently\" offered a wearer a line of source code as the answer to a question nobody asked",
        "deps": [
          "ClaudeCodeService",
          "KimiService"
        ]
      },
      {
        "name": "ClaudeCodeService",
        "file": "backend/src/services/claude-code.ts",
        "summary": "Watches Claude Code session state through the .jsonl files under ~/.claude/projects. Layered caches (TTY 10s, session data 30s, path resolution 3s, each capped at 1000 entries). Parses the JSONL to detect a permission prompt, tool use and the waiting-for-input state. An active session is matched only by herdr's native agent session id",
        "deps": []
      },
      {
        "name": "SessionHistoryService",
        "file": "backend/src/services/session-history.ts",
        "summary": "Serves past session history and conversations from the JSONL under ~/.claude/projects. Scans projects in parallel, extracts firstPrompt / lastPrompt / git branch / token usage / recap, and implements streaming full-text search (SSE)",
        "deps": []
      },
      {
        "name": "SessionMetadataService",
        "file": "backend/src/services/session-metadata.ts",
        "summary": "Persists a session's theme, its STT vocabulary and the last known sessions for recovery after a reboot. Deliberately not the session order or the title - both live in herdr (order = workspace order, title = workspace label), so nothing here can disagree with what herdr shows",
        "deps": []
      },
      {
        "name": "SessionsService",
        "file": "backend/src/services/sessions.ts",
        "summary": "File-based CRUD for session metadata (id, name, createdAt, lastAccessedAt, state), sorted by lastAccessedAt descending",
        "deps": []
      },
      {
        "name": "PromptHistoryService",
        "file": "backend/src/services/prompt-history.ts",
        "summary": "Substring search over ~/.claude/history.jsonl (case-insensitive), returning matches newest first with their project path and session ID",
        "deps": []
      },
      {
        "name": "FileService",
        "file": "backend/src/services/file-service.ts",
        "summary": "Safe file and directory operations with path traversal prevention. Decides binary from the extension plus a heuristic (NUL bytes, the ratio of control characters) and returns UTF-8 or base64",
        "deps": []
      },
      {
        "name": "FileChangeTracker",
        "file": "backend/src/services/file-change-tracker.ts",
        "summary": "Extracts Write/Edit tool use (path, old/new string, timestamp) from the Claude Code JSONL. Deduplicates per path and sorts chronologically for the change-history UI",
        "deps": []
      },
      {
        "name": "AnthropicUsageService",
        "file": "backend/src/services/anthropic-usage.ts",
        "summary": "Fetches usage limits (the 5-hour and 7-day cycles) from the Anthropic API. The attempt is stamped when it starts and gated on a 60s TTL, so upstream sees at most one call a minute regardless of whether the last one succeeded, failed or threw (the rate limit is per account, making this the only thing standing between polling and a 429). A 429 backs off for longer, honoring Retry-After, and in-flight requests are coalesced. Also estimates when the current pace reaches the limit. Extracts per-model limits (Fable and friends) from the scoped entries in `limits[]` - the overall cycle can look comfortable while a model-specific one is pinned. Entries it cannot interpret are discarded rather than guessed at",
        "deps": []
      },
      {
        "name": "AnthropicModels",
        "file": "backend/src/services/anthropic-models.ts",
        "summary": "Fetches Anthropic model metadata (maximum input tokens and so on). 24h cache with request coalescing. Used by the cost and usage calculations",
        "deps": []
      },
      {
        "name": "StatsService",
        "file": "backend/src/services/stats-service.ts",
        "summary": "Reads ~/.claude/stats-cache.json (written by the Claude CLI) and aggregates daily activity and per-model token kinds (input/cache_read/cache_creation/output). Estimates cost from a fixed price table",
        "deps": []
      },
      {
        "name": "UsageHistoryService",
        "file": "backend/src/services/usage-history.ts",
        "summary": "Records usage snapshots to /tmp/hrdle-usage-history.json, throttled to 30s. Keeps 8 days for the utilization trend chart. Per-model limits are recorded under `scoped` (an older snapshot without that key counts as 'not measured' rather than 0%)",
        "deps": []
      },
      {
        "name": "SystemMetricsService",
        "file": "backend/src/services/system-metrics.ts",
        "summary": "Collects CPU%, memory, swap and load average. A rolling history of 60 entries (minimum 3s between snapshots). Swap comes from /proc/meminfo (Linux only)",
        "deps": []
      },
      {
        "name": "SessionMetricsService",
        "file": "backend/src/services/session-metrics.ts",
        "summary": "Aggregates per-session context tokens (the last turn's input + cache_creation + cache_read) and totals from the JSONL, cached on mtime+size. Process-tree RSS comes from ps (1s cache)",
        "deps": [
          "AnthropicModels"
        ]
      },
      {
        "name": "AgentProviders",
        "file": "backend/src/services/agent-providers.ts",
        "summary": "The common AgentThreadService / AgentHistoryProvider interfaces for thread-based agents (Codex, Grok, Kimi, OpenCode). Claude stays on its own path (jsonl metadata + WebSocket stream); routes iterate provider maps instead of hardcoding an agent, so adding one is a single AGENT_PROVIDERS entry in shared/types.ts plus an implementation of each interface",
        "deps": []
      },
      {
        "name": "CodexService",
        "file": "backend/src/services/codex.ts",
        "summary": "Reads an active thread's metadata (title, tokens_used, git_branch, cwd) from Codex's SQLite threads table (state_5.sqlite), cached 5s by cwd. Token usage is extracted from the tail of the rollout file (up to 4MB)",
        "deps": []
      },
      {
        "name": "CodexConversationService",
        "file": "backend/src/services/codex-conversation.ts",
        "summary": "Converts Codex rollout JSONL events (user_message, agent_message, function_call and so on) into Claude-shaped ConversationMessages. The rollout path is resolved from the SQLite threads table",
        "deps": []
      },

    "intervals": {
      "sessions-updated push": "5s",

    },

    },

  "data_flows": [
    {
      "name": "Terminal input",
      "steps": [
        "The browser (xterm onData / InputBar)",
        "useMultiplexedTerminal.sendInput → JSON { type:'input', sessionId, paneId, data: base64 }",
        "Validated with zod in /ws/mux (terminal-mux.ts)",
        "HerdrControlSession.sendInput (raw bytes as base64 into the control stream)",
        "The herdr pane's PTY -> the Claude Code / Codex process"
      ]
    },
    {
      "name": "Terminal output (viewport)",
      "steps": [
        "herdr terminal.frame (pane control stream)",
        "HerdrControlSession sees the output (a frame arrives)",
        "PaneViewport captures the visible region (padFill unless it is an alt screen)",
        "The viewport frame { paneId, lines, cursor, modes, historySize, offset, atTail } is pushed to live subscribers",
        "Frontend: viewportToVTSequence() turns it into a VT sequence",
        "xterm.js term.write() updates the screen (render-only, scrollback:0)"
      ]
    },
    {
      "name": "Reading the scrollback",
      "steps": [
        "The user scrolls (wheel or touch)",
        "Sends request-viewport { paneId, offset: N }",
        "The server reads the viewport N lines up",
        "Replies with a viewport (atTail=false, the cursor hidden)",
        "Tapping the terminal or showing the soft keyboard returns to offset=0 (live)"
      ]
    },
    {
      "name": "Layout synchronization",
      "steps": [
        "A pane operation (split / close / resize / zoom)",
        "A split or resize, or a pane event, triggers a reconcile",
        "HerdrLayout converts the split tree into TmuxLayoutNode rectangles",
        "The layout frame goes to every subscribed client",
        "PaneContainer redraws the tree and Terminal.setExactSize() fixes the size"
      ]
    },
    {
      "name": "Hook notifications",
      "steps": [
        "A Claude Code / Codex / Grok / Kimi hook (Stop, or PostToolUse for AskUserQuestion)",
        "The notify command (reading the hook JSON from stdin; Grok's camelCase shape is normalized)",
        "POST /api/notify (unauthenticated)",
        "The pane is resolved from the hook's session_id or cwd. With glasses subscribed, a relay info item is created instead (90s TTL)",
        "The hook-event frame is broadcast over the WebSocket, carrying deliveredToGlasses",
        "A browser OS notification fires only when that flag is down - a duplicate notification beats a lost one",
        "Web Push covers the case where no tab is awake to fire it"
      ]
    },
    {
      "name": "The real-time conversation stream",
      "steps": [
        "The client sends subscribe-conversation { sessionId, agentSessionId } - the pane's agent session, since a workspace with two agent panes holds two conversations",
        "ConversationWatcher watches that JSONL with fs.watch (150ms debounce)",
        "initial-conversation carries the whole thing; conversation-update then carries new turns only",
        "A thread agent (codex / grok / kimi / opencode) has no server-side tail, so useThreadConversation polls instead",
        "ChatView / ConversationViewer render the increment"
      ]
    },
    {
      "name": "Aggregating peer sessions",
      "steps": [
        "A peer is registered in PeerManager (PeerAuth logs in and stores the JWT; PeerUrl guards against SSRF)",
        "usePeers polls /api/peers every 5s (the list and its status)",
        "usePeerSessionsWatcher holds a WS to each remote peer's /ws/mux with its wsToken",
        "Each peer's sessions-updated and hook-event arrive",
        "useWorkspaces merges the local and peer sessions for the UI"
      ]
    },
    {
      "name": "Remote pane control (`send` / `peek`)",
      "steps": [
        "CLI: hrdle send <peer>:<session>:<paneId> [text]",
        "Resolves the peer (local / peer id / nickname) and its credentials",
        "POST /api/sessions/:id/panes/input (with --wait it captures a viewport afterwards)",
        "GET /api/sessions/:id/panes/:paneId/viewport (hrdle peek)",
        "Prints the viewport's last N lines and the detected state (idle / processing / permission_prompt / ask_user_question)"
      ]
    },
    {
      "name": "Answering from the glasses",
      "steps": [
        "herdr reports a pane going blocked (pane.agent_status_changed)",
        "GlassesRelayService assembles a waiting item - but only while a glasses client is subscribed (the presence gate)",
        "The question comes from the agent's own record (AgentQuestion) or its pane reader, never from a general shape match; an agent with no reader gets no options",
        "glasses-relay is pushed to subscribed mux connections; the G2 draws it",
        "The wearer answers with a ring or touch gesture -> glasses-input -> the key that answers that row (choiceKeys, decided on the server)",
        "Raw bytes go to the pane's control stream, exactly as a browser keystroke would"
      ]
    },
    {
      "name": "Speech to text from the glasses",
      "steps": [
        "The G2 SDK hands over raw PCM (it cannot transcribe), posted to /api/glasses/stt with the target session",
        "resolveSttRequest decides the whole request once: model, language, and the vocabulary prompt (the session's own words first, then the glossary, within 190 characters, the session capped at half)",
        "Groq whisper transcribes; GROQ_API_KEY never leaves this host",
        "Consumption is recorded on the way past, before the status is acted on - a 429 still spends quota",
        "SttCorrections repairs the two things a prompt cannot: spelling of glossary terms, and the stock sign-off Whisper writes over silence",
        "The text is typed into the target pane, and the recorder writes down what produced it"
      ]
    }
  ]
}</script>

    <section class="panel" data-panel="backend-services"></section>
    <section class="panel" data-panel="backend-routes"></section>
    <section class="panel" data-panel="frontend-components"></section>
    <section class="panel" data-panel="frontend-hooks"></section>
    <section class="panel" data-panel="websocket"></section>
    <section class="panel" data-panel="types"></section>
    <section class="panel" data-panel="flows"></section>
  </div>
</main>
<script>
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

let DATA = null;
let activeQuery = '';

async function load() {
  // 1) Inline JSON (for a blob URL or sandboxed environment, such as the HTML viewer)
  try {
    const inlineEl = document.getElementById('arch-data');
    const inlineRaw = inlineEl ? inlineEl.textContent.trim() : '';
    // Not embedded yet means empty contents or just the placeholder comment, so skip.
    // Once embedded it is always a JSON object, so it starts with "{".
    if (inlineRaw.startsWith('{')) {
      DATA = JSON.parse(inlineRaw);
    }
  } catch (err) {
    console.warn('inline JSON parse failed, falling back to fetch:', err);
  }

  // 2) fetch (when opened through an http server). With the inline copy already read, this is a background refresh.
  if (!DATA) {
    try {
      const r = await fetch('architecture.json', { cache: 'no-store' });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      DATA = await r.json();
    } catch (err) {
      $('#loading').innerHTML = `<div style="color:var(--red)">Cannot load architecture.json: ${esc(err.message)}<br><br>There is no embedded JSON either, so nothing can be shown. Regenerate it with <code>build-architecture-html</code>, or serve the directory with <code>python3 -m http.server</code>.</div>`;
      return;
    }
  }

  $('#loading').style.display = 'none';
  $('#panels').style.display = 'block';
  render();
  bindTabs();
  bindSearch();
}

function render() {
  $('#hdr-version').textContent = 'v' + DATA.version;
  $('#hdr-meta').textContent = 'generated ' + DATA.generated;
  $('#cnt-services').textContent = DATA.backend.services.length;
  $('#cnt-routes').textContent = DATA.backend.routes.length;
  $('#cnt-components').textContent = DATA.frontend.components.length;
  $('#cnt-hooks').textContent = DATA.frontend.hooks.length;
  $('#cnt-types').textContent = DATA.types.length;
  $('#cnt-flows').textContent = DATA.data_flows.length;

  renderOverview();
  renderServices();
  renderRoutes();
  renderComponents();
  renderHooks();
  renderWebSocket();
  renderTypes();
  renderFlows();
}

function renderOverview() {
  const p = $('[data-panel="overview"]');
  p.innerHTML = `
    <div class="desc">
      <h2>${esc(DATA.name)}</h2>
      <div>${esc(DATA.summary)}</div>
      <dl class="stack">
        <dt>Backend</dt><dd>${esc(DATA.stack.backend)}</dd>
        <dt>Frontend</dt><dd>${esc(DATA.stack.frontend)}</dd>
        <dt>Shared</dt><dd>${esc(DATA.stack.shared)}</dd>
        <dt>Glasses</dt><dd>${esc(DATA.stack.glasses)}</dd>
        <dt>Transport</dt><dd>${esc(DATA.stack.transport)}</dd>
      </dl>
    </div>
    ${Array.isArray(DATA.diagram) ? `<pre class="arch-diagram">${esc(DATA.diagram.join('\n'))}</pre>` : ''}
    ${Array.isArray(DATA.workspaces) ? `<div class="ws-list">${DATA.workspaces.map(w => `<div class="ws-item"><span class="ws-name">${esc(w.name)}/</span><span class="ws-desc">${esc(w.desc)}</span></div>`).join('')}</div>` : ''}
    <div class="overview-grid">
      ${stat('Backend Services', DATA.backend.services.length)}
      ${stat('API Routes', DATA.backend.routes.length)}
      ${stat('Frontend Components', DATA.frontend.components.length)}
      ${stat('Frontend Hooks', DATA.frontend.hooks.length)}
      ${stat('Shared Types', DATA.types.length)}
      ${stat('Documented Data Flows', DATA.data_flows.length)}
    </div>
  `;
}

const stat = (label, num) => `<div class="stat"><div class="num">${num}</div><div class="label">${esc(label)}</div></div>`;

function matches(text, q) {
  if (!q) return true;
  return text.toLowerCase().includes(q.toLowerCase());
}

function svcCard(s, q) {
  const body = [s.name, s.file, s.summary, ...(s.deps || [])].join(' ');
  if (!matches(body, q)) return '';
  return `<div class="card">
    <div class="card-header">
      <span class="name">${esc(s.name)}</span>
      <span class="file">${esc(s.file)}</span>
    </div>
    <div class="summary">${esc(s.summary)}</div>
    ${s.deps && s.deps.length ? `<div class="deps"><span class="label">deps:</span>${s.deps.map(d => `<span data-jump="${esc(d)}">${esc(d)}</span>`).join('')}</div>` : ''}
  </div>`;
}

function renderServices() {
  const p = $('[data-panel="backend-services"]');
  p.innerHTML = DATA.backend.services.map(s => svcCard(s, activeQuery)).join('') || '<div class="empty">No matches</div>';
}

function routeCard(r, q) {
  const body = [r.method, r.path, r.description, r.file].join(' ');
  if (!matches(body, q)) return '';
  return `<div class="card">
    <div class="card-header">
      <span class="badge ${esc(r.method)}">${esc(r.method)}</span>
      <span class="name" style="font-family:monospace">${esc(r.path)}</span>
      <span class="file">${esc(r.file)}</span>
    </div>
    <div class="summary">${esc(r.description)}</div>
  </div>`;
}

function renderRoutes() {
  const p = $('[data-panel="backend-routes"]');
  const groups = {};
  for (const r of DATA.backend.routes) {
    (groups[r.group] = groups[r.group] || []).push(r);
  }
  let html = '';
  for (const [g, list] of Object.entries(groups)) {
    const inner = list.map(r => routeCard(r, activeQuery)).filter(Boolean).join('');
    if (!inner) continue;
    html += `<div class="group-header">${esc(g)}</div>${inner}`;
  }
  p.innerHTML = html || '<div class="empty">No matches</div>';
}

function compCard(c, q) {
  const body = [c.name, c.file, c.summary, ...(c.hooks || []), ...(c.parents || [])].join(' ');
  if (!matches(body, q)) return '';
  return `<div class="card">
    <div class="card-header">
      <span class="name">${esc(c.name)}</span>
      <span class="file">${esc(c.file)}</span>
    </div>
    <div class="summary">${esc(c.summary)}</div>
    ${c.hooks && c.hooks.length ? `<div class="hooks-list"><span class="label">hooks:</span>${c.hooks.map(h => `<span data-jump="${esc(h)}">${esc(h)}</span>`).join('')}</div>` : ''}
    ${c.parents && c.parents.length ? `<div class="parents"><span class="label">parents:</span>${c.parents.map(par => `<span data-jump="${esc(par)}">${esc(par)}</span>`).join('')}</div>` : ''}
  </div>`;
}

function renderComponents() {
  const p = $('[data-panel="frontend-components"]');
  p.innerHTML = DATA.frontend.components.map(c => compCard(c, activeQuery)).filter(Boolean).join('') || '<div class="empty">No matches</div>';
}

function hookCard(h, q) {
  const body = [h.name, h.file, h.summary].join(' ');
  if (!matches(body, q)) return '';
  return `<div class="card">
    <div class="card-header">
      <span class="name">${esc(h.name)}</span>
      <span class="file">${esc(h.file)}</span>
    </div>
    <div class="summary">${esc(h.summary)}</div>
  </div>`;
}

function renderHooks() {
  const p = $('[data-panel="frontend-hooks"]');
  p.innerHTML = DATA.frontend.hooks.map(h => hookCard(h, activeQuery)).filter(Boolean).join('') || '<div class="empty">No matches</div>';
}

function renderWebSocket() {
  const p = $('[data-panel="websocket"]');
  const w = DATA.websocket;
  p.innerHTML = `
    <div class="ws-section">
      <div class="endpoint">${esc(w.endpoint)}</div>
      <div class="desc">${esc(w.description)}</div>
      <div class="grid">
        <div class="col">
          <h4>Client → Server</h4>
          <div class="sub"><div class="lbl">Mux level</div>${w.client_messages.mux_level.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
          <div class="sub"><div class="lbl">Per session</div>${w.client_messages.per_session.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
        </div>
        <div class="col">
          <h4>Server → Client</h4>
          <div class="sub"><div class="lbl">Mux level</div>${w.server_messages.mux_level.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
          <div class="sub"><div class="lbl">Per session</div>${w.server_messages.per_session.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
        </div>
      </div>
      <div style="margin-top:16px">
        <div class="lbl" style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;font-weight:600">Binary frame format</div>
        <code class="binary">${esc(w.binary_format)}</code>
      </div>
      <dl class="intervals">
        ${Object.entries(w.intervals).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}
      </dl>
    </div>
  `;
}

function renderTypes() {
  const p = $('[data-panel="types"]');
  p.innerHTML = DATA.types.filter(t => matches(`${t.name} ${t.fields}`, activeQuery)).map(t => `
    <div class="type-card">
      <div class="tname">${esc(t.name)}</div>
      <div class="tfields">${esc(t.fields)}</div>
    </div>
  `).join('') || '<div class="empty">No matches</div>';
}

function renderFlows() {
  const p = $('[data-panel="flows"]');
  p.innerHTML = DATA.data_flows.filter(f => matches(`${f.name} ${f.steps.join(' ')}`, activeQuery)).map(f => `
    <div class="flow">
      <h3>${esc(f.name)}</h3>
      <ol>${f.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>
    </div>
  `).join('') || '<div class="empty">No matches</div>';
}

function bindTabs() {
  $$('#tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
      $$('#tabs button').forEach(b => b.classList.toggle('active', b === btn));
      const tab = btn.dataset.tab;
      $$('.panel').forEach(p => p.classList.toggle('active', p.dataset.panel === tab));
    });
  });
  // Click to jump to a type name or a dependency
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-jump]');
    if (!t) return;
    const name = t.dataset.jump;
    // Put the name in the search box and switch to the most likely tab
    $('#q').value = name;
    onSearch();
    const tabPriority = [
      ['backend-services', DATA.backend.services.some(s => s.name === name)],
      ['frontend-hooks', DATA.frontend.hooks.some(h => h.name === name)],
      ['frontend-components', DATA.frontend.components.some(c => c.name === name)],
    ];
    for (const [tab, hit] of tabPriority) {
      if (hit) {
        $(`#tabs button[data-tab="${tab}"]`).click();
        break;
      }
    }
  });
}

function onSearch() {
  activeQuery = $('#q').value.trim();
  renderServices();
  renderRoutes();
  renderComponents();
  renderHooks();
  renderTypes();
  renderFlows();
}

function bindSearch() {
  $('#q').addEventListener('input', onSearch);
}

load();
</script>
</body>
</html>
