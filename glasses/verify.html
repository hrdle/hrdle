<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hrdle - Verify</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; background: #111; color: #eee; padding: 16px; }
    h1 { font-size: 20px; margin-bottom: 16px; }
    h2 { font-size: 16px; margin: 16px 0 8px; color: #0f0; }
    .card { background: #222; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .status { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; }
    .ok { background: #0f0; }
    .fail { background: #f00; }
    .pending { background: #ff0; }
    .log { background: #000; color: #0f0; font-family: monospace; font-size: 12px; padding: 8px; border-radius: 4px; min-height: 60px; white-space: pre-wrap; max-height: 200px; overflow-y: auto; }
    input { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #444; background: #333; color: #eee; font-size: 14px; margin: 4px 0; }
    button { padding: 8px 16px; border-radius: 4px; border: none; background: #0a0; color: #fff; font-size: 14px; cursor: pointer; margin: 4px 4px 4px 0; }
    button:active { background: #080; }
    .small { font-size: 12px; color: #888; }
    #glasses-ui { display: none; }
  </style>
</head>
<body>
  <!-- Phone UI (default) -->
  <div id="phone-ui">
    <h1>Hrdle verification tool</h1>

    <!-- 1. Launch Source -->
    <div class="card">
      <h2>1. Launch source</h2>
      <div id="launch-source">Detecting...</div>
    </div>

    <!-- 2. Events -->
    <div class="card">
      <h2>2. Events (ring / temple)</h2>
      <p class="small">Try a tap, a double tap and a swipe</p>
      <div class="log" id="event-log">Waiting for an event...</div>
      <div style="margin-top:8px">
        <span>Tap: <span id="tap-count">0</span></span> |
        <span>Double tap: <span id="dbl-count">0</span></span> |
        <span>Swipe: <span id="swipe-count">0</span></span>
      </div>
    </div>

    <!-- 3. HTTPS Test -->
    <div class="card">
      <h2>3. HTTPS connection test</h2>
      <input id="url-input" type="url" placeholder="https://hostname.tail*****.ts.net:5923" />
      <button id="url-test">Test the connection</button>
      <div id="url-result"></div>
    </div>

    <!-- 4. LocalStorage -->
    <div class="card">
      <h2>4. LocalStorage sharing test</h2>
      <input id="ls-key" type="text" value="hrdle-url" placeholder="key" />
      <input id="ls-value" type="text" placeholder="value to store" />
      <button id="ls-save">Save</button>
      <button id="ls-load">Load</button>
      <div id="ls-result"></div>
    </div>

    <!-- 5. Form Input -->
    <div class="card">
      <h2>5. Form input test</h2>
      <input id="form-test" type="text" placeholder="Type here..." />
      <div id="form-result" class="small"></div>
    </div>

    <!-- 6. Device Info -->
    <div class="card">
      <h2>6. Device info</h2>
      <div id="device-info">Loading...</div>
    </div>
  </div>

  <!-- Glasses UI -->
  <div id="glasses-ui">
    <div style="background:#000; color:#0f0; font-family:monospace; padding:8px; font-size:14px;">
      <div id="g2-content">Hrdle Verify</div>
    </div>
  </div>

  <script type="module">
    import {
      waitForEvenAppBridge,
      TextContainerProperty,
      CreateStartUpPageContainer,
      OsEventTypeList,
      EventSourceType,
    } from '@evenrealities/even_hub_sdk'

    const eventLog = []
    let tapCount = 0, dblCount = 0, swipeCount = 0
    let bridge = null
    let charTestCount = 120
    const CHAR_STEP = 10
    const TEST_STR = 'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん漢字交じり表示テスト用の文字列abcdefghijklmnopqrstuvwxyz ABCDEFGHIJKLMNOP 0123456789 '
    function makeTestStr(n) {
      let s = ''
      while (s.length < n) s += TEST_STR
      return s.slice(0, n)
    }

    function log(msg) {
      const ts = new Date().toLocaleTimeString()
      eventLog.unshift(`[${ts}] ${msg}`)
      if (eventLog.length > 20) eventLog.pop()
      const el = document.getElementById('event-log')
      if (el) el.textContent = eventLog.join('\n')
    }

    function setResult(id, html) {
      const el = document.getElementById(id)
      if (el) el.innerHTML = html
    }

    // Init bridge
    try {
      bridge = await Promise.race([
        waitForEvenAppBridge(),
        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 5000)),
      ])
      log('Bridge OK')
    } catch (e) {
      log('Bridge: ' + e.message + ' (browser debug mode)')
    }

    // 1. Launch Source
    if (bridge) {
      // Always init glasses UI immediately (onLaunchSource may not fire)
      setupGlassesUI()
      log('Glasses UI initialized')

      // Auto-read LocalStorage on glasses and show in initial UI
      try {
        const savedUrl = await bridge.getLocalStorage('hrdle-url')
        const lsText = savedUrl ? `LS OK: ${savedUrl}` : 'LS: (empty)'
        log('hrdle-url: ' + (savedUrl || '(empty)'))
        // Update both containers with LS result
        const { TextContainerUpgrade } = await import('@evenrealities/even_hub_sdk')
        await bridge.textContainerUpgrade(new TextContainerUpgrade({
          containerID: 2, containerName: 'log',
          content: lsText,
        }))
        await bridge.textContainerUpgrade(new TextContainerUpgrade({
          containerID: 3, containerName: 'count',
          content: 'Tap/Swipe to test',
        }))
      } catch (e) {
        log('LS error: ' + e.message)
      }

      bridge.onLaunchSource((source) => {
        setResult('launch-source', `<span class="status ok"></span>${source}`)
        log('LaunchSource: ' + source)
      })
      setResult('launch-source', '<span class="status pending"></span>Bridge OK, waiting for LaunchSource...')
    } else {
      setResult('launch-source', '<span class="status pending"></span>No SDK (browser mode)')
    }

    // 2. Events
    if (bridge) {
      bridge.onEvenHubEvent((event) => {
        const raw = JSON.stringify(event)

        // Identify event
        const textType = event.textEvent?.eventType
        const sysType = event.sysEvent?.eventType
        const listType = event.listEvent?.eventType
        const eventType = textType ?? sysType ?? listType
        const source = event.textEvent ? 'text' : event.sysEvent ? 'sys' : event.listEvent ? 'list' : '?'
        const eventSource = event.sysEvent?.eventSource ?? event.textEvent?.containerID

        // Detect ring tap (sysEvent with undefined eventType)
        const isRingTap = event.sysEvent && sysType == null && !event.sysEvent.imuData

        let name = 'unknown'
        if (isRingTap) {
          name = 'RING_TAP (eventType=undefined)'
          tapCount++
        } else if (eventType === OsEventTypeList.CLICK_EVENT) {
          name = 'CLICK_EVENT (0)'
          tapCount++
        } else if (eventType === OsEventTypeList.DOUBLE_CLICK_EVENT) {
          name = 'DOUBLE_CLICK_EVENT (3)'
          dblCount++
        } else if (eventType === OsEventTypeList.SCROLL_TOP_EVENT) {
          name = 'SCROLL_TOP_EVENT (1)'
          swipeCount++
          // Char test: decrease
          charTestCount = Math.max(10, charTestCount - CHAR_STEP)
          updateCharTest()
        } else if (eventType === OsEventTypeList.SCROLL_BOTTOM_EVENT) {
          name = 'SCROLL_BOTTOM_EVENT (2)'
          swipeCount++
          // Char test: increase
          charTestCount += CHAR_STEP
          updateCharTest()
        } else if (eventType === OsEventTypeList.IMU_DATA_REPORT) {
          return // Skip IMU spam
        } else {
          name = `type=${eventType}`
        }

        const srcName = {
          [EventSourceType.TOUCH_EVENT_FROM_RING]: 'RING',
          [EventSourceType.TOUCH_EVENT_FROM_GLASSES_R]: 'GLASSES_R',
          [EventSourceType.TOUCH_EVENT_FROM_GLASSES_L]: 'GLASSES_L',
        }[eventSource] || `src=${eventSource}`

        log(`${source}:${name} [${srcName}]`)

        document.getElementById('tap-count').textContent = tapCount
        document.getElementById('dbl-count').textContent = dblCount
        document.getElementById('swipe-count').textContent = swipeCount

        // Update glasses UI if visible
        updateGlassesContent(`Last: ${name}\n${srcName}\nTap:${tapCount} Dbl:${dblCount} Swipe:${swipeCount}`)
      })
    }

    // 3. HTTPS Test
    document.getElementById('url-test').addEventListener('click', async () => {
      const url = document.getElementById('url-input').value.trim()
      if (!url) {
        setResult('url-result', '<span class="status fail"></span>Enter a URL')
        return
      }
      setResult('url-result', '<span class="status pending"></span>Connecting...')
      try {
        const res = await fetch(url + '/api/dashboard', { signal: AbortSignal.timeout(5000) })
        if (res.ok) {
          const data = await res.json()
          setResult('url-result',
            `<span class="status ok"></span>Connected. v${data.version || '?'}, counting sessions...`)
          // Try sessions
          const sRes = await fetch(url + '/api/sessions')
          if (sRes.ok) {
            const sData = await sRes.json()
            setResult('url-result',
              `<span class="status ok"></span>Connected. v${data.version || '?'}, ${sData.sessions?.length || 0} sessions`)
          }
        } else {
          setResult('url-result', `<span class="status fail"></span>HTTP ${res.status}`)
        }
      } catch (e) {
        setResult('url-result', `<span class="status fail"></span>${e.message}`)
      }
    })

    // 4. LocalStorage
    document.getElementById('ls-save').addEventListener('click', async () => {
      const key = document.getElementById('ls-key').value
      const value = document.getElementById('ls-value').value
      if (bridge) {
        const ok = await bridge.setLocalStorage(key, value)
        setResult('ls-result', ok
          ? `<span class="status ok"></span>Saved: ${key} = "${value}"`
          : `<span class="status fail"></span>Save failed`)
      } else {
        localStorage.setItem(key, value)
        setResult('ls-result', `<span class="status ok"></span>Browser localStorage saved: ${key} = "${value}"`)
      }
    })

    document.getElementById('ls-load').addEventListener('click', async () => {
      const key = document.getElementById('ls-key').value
      if (bridge) {
        const value = await bridge.getLocalStorage(key)
        setResult('ls-result', value
          ? `<span class="status ok"></span>Loaded: ${key} = "${value}"`
          : `<span class="status pending"></span>No value (empty string)`)
      } else {
        const value = localStorage.getItem(key)
        setResult('ls-result', value
          ? `<span class="status ok"></span>Browser localStorage: ${key} = "${value}"`
          : `<span class="status pending"></span>No value`)
      }
    })

    // 5. Form Input
    document.getElementById('form-test').addEventListener('input', (e) => {
      setResult('form-result', `Input OK: "${e.target.value}"`)
    })

    // 6. Device Info
    if (bridge) {
      try {
        const [user, device] = await Promise.all([
          bridge.getUserInfo().catch(() => null),
          bridge.getDeviceInfo().catch(() => null),
        ])
        const lines = []
        if (user) lines.push(`User: ${user.name} (uid:${user.uid})`)
        if (device) lines.push(`Device: ${device.model}`, `Status: ${device.status?.connectType}`)
        lines.push(`UserAgent: ${navigator.userAgent.slice(0, 80)}`)
        setResult('device-info', lines.join('<br>'))
      } catch (e) {
        setResult('device-info', 'Error: ' + e.message)
      }
    } else {
      setResult('device-info', `UserAgent: ${navigator.userAgent.slice(0, 80)}<br>No SDK (browser mode)`)
    }

    // Glasses UI — character limit test

    async function setupGlassesUI() {
      if (!bridge) return
      const W = 576
      try {
        const result = await bridge.createStartUpPageContainer(new CreateStartUpPageContainer({
          containerTotalNum: 4,
          textObject: [
            new TextContainerProperty({
              xPosition: 0, yPosition: 0, width: W, height: 40,
              containerID: 1, containerName: 'title',
              isEventCapture: 0,
              content: `Char test: ${charTestCount}`,
            }),
            new TextContainerProperty({
              xPosition: 0, yPosition: 48, width: W, height: 192,
              containerID: 2, containerName: 'body',
              isEventCapture: 0,
              content: makeTestStr(charTestCount),
            }),
            new TextContainerProperty({
              xPosition: 0, yPosition: 244, width: W, height: 4,
              containerID: 3, containerName: 'spacer',
              isEventCapture: 0,
              content: '',
            }),
            new TextContainerProperty({
              xPosition: 0, yPosition: 252, width: W, height: 36,
              containerID: 4, containerName: 'footer',
              isEventCapture: 1,
              content: `swipe: +/-${CHAR_STEP}`,
            }),
          ],
        }))
        log('createStartUp result: ' + JSON.stringify(result))
      } catch (e) {
        log('createStartUp ERROR: ' + e.message)
      }
    }

    function updateCharTest() {
      if (!bridge) return
      import('@evenrealities/even_hub_sdk').then(({ TextContainerUpgrade }) => {
        bridge.textContainerUpgrade(new TextContainerUpgrade({
          containerID: 1, containerName: 'title',
          content: `Char test: ${charTestCount}`,
        }))
        bridge.textContainerUpgrade(new TextContainerUpgrade({
          containerID: 2, containerName: 'body',
          content: makeTestStr(charTestCount),
        }))
      }).catch(() => {})
    }

    function updateGlassesContent(text) {
      const el = document.getElementById('g2-content')
      if (el) el.textContent = text
    }

  </script>
</body>
</html>
