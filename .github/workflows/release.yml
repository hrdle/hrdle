name: Release

on:
  push:
    tags:
      - 'v*'
  # Run it against a tag that is already pushed.
  #
  # A tag push is the only thing that used to start this, and on 2026-08-07
  # GitHub dropped those webhooks for hours while branch pushes still arrived
  # late: v0.3.68 and v0.3.70 were both tagged and neither produced a Release,
  # so `hrdle update` had nothing to fetch. Re-pushing the tag did not help -
  # the same webhook goes missing again.
  #
  # A dispatch is an API call rather than a webhook, so it does not depend on
  # the delivery that failed. Run it with `--ref <tag>`: the release action
  # takes its tag from the ref it is running on.
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact: hrdle-linux-x64
          - os: macos-latest
            target: macos
            artifact: hrdle-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build binary
        run: bun run build:binary

      - name: Rename binary
        run: mv dist/hrdle dist/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: hrdle-linux-x64
          path: dist

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: hrdle-macos-arm64
          path: dist

      # Publish per-asset SHA-256 hashes so `hrdle update` can verify the
      # downloaded binary's integrity before replacing the running service. #255
      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum hrdle-linux-x64 hrdle-macos-arm64 > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/hrdle-linux-x64
            dist/hrdle-macos-arm64
            dist/SHA256SUMS
          generate_release_notes: true
